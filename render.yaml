services:
  - type: web
    name: url-shortener-api
    runtime: python
    plan: free
    rootDir: back
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # pedido no painel do Render ao criar
      - key: CORS_ORIGINS
        sync: false # ex: ["https://meu-app.vercel.app"]
