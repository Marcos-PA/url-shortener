<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>URL Shortener</title>
  <!-- Same idea as the URL ruler: a long warm bar (original URL) over a short cool bar (short link).
       Hex values are the theme tokens card and chart-1 to chart-5, converted from oklch. -->
  <defs>
    <linearGradient id="long" x1="0" x2="1">
      <stop offset="0" stop-color="#f89d00" />
      <stop offset=".5" stop-color="#fa6e1d" />
      <stop offset="1" stop-color="#f83e5e" />
    </linearGradient>
    <linearGradient id="short" x1="0" x2="1">
      <stop offset="0" stop-color="#3981f6" />
      <stop offset="1" stop-color="#00c484" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#171717" />
  <rect x="6" y="9.5" width="20" height="5" rx="2.5" fill="url(#long)" />
  <rect x="6" y="17.5" width="20" height="5" rx="2.5" fill="#00c484" fill-opacity=".18" />
  <rect x="6" y="17.5" width="9" height="5" rx="2.5" fill="url(#short)" />
</svg>
